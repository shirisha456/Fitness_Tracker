upstream api_backend {
    server api-java:8000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10M;

    # The real backend is always versioned (/api/v1/...). Every Next.js BFF Route
    # Handler (frontend/app/api/**) is unversioned (/api/auth/*, /api/workouts, /api/exercises,
    # and any future resource) and proxies to the backend itself, server-side. Splitting on the
    # /v1/ segment means new BFF routes never need a new nginx block — only this one rule.
    location /api/v1/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /api/ {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
