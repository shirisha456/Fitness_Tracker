name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java

    # No `services:` block. The integration tests use Testcontainers, which starts its
    # own PostgreSQL and Redis against the runner's Docker daemon — that is the whole
    # point of Testcontainers, and a second set of service containers would only be
    # confusing. GitHub's ubuntu-latest runners have Docker available by default.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify
        run: ./mvnw -B verify
        env:
          # docker-java (inside Testcontainers) negotiates Docker API v1.32, which Docker
          # Engine 25+ rejects (MinAPIVersion 1.40). The pom pins this via the
          # docker.api.version property; the env var is belt and braces for runners whose
          # engine predates it.
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend-java/target/surefire-reports/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost/api
