# Compose-specific overrides. The base application.properties already reads
# DATABASE_URL / REDIS_URL from the environment, so this file exists for settings that
# only make sense inside a container.

# Flyway runs at startup here, against the shared database. On a database the Python
# backend built, baseline-on-migrate records V1 as already applied and nothing executes.
spring.flyway.enabled=true

# Container stdout is the log sink; no file appenders.
logging.file.name=
