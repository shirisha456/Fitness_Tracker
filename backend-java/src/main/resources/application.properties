spring.application.name=fitness-tracker-backend

# --- Persistence -------------------------------------------------------------
# Hibernate never generates DDL. The schema is owned by Flyway (and, until the
# cutover, historically by Alembic); a drift must fail startup, not be repaired.
spring.jpa.hibernate.ddl-auto=validate
# Keeping a session open into the view layer hides N+1 queries and holds a
# connection for the whole request. DTOs are assembled in services instead.
spring.jpa.open-in-view=false

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fitforge}
spring.datasource.username=${POSTGRES_USER:fitforge}
spring.datasource.password=${POSTGRES_PASSWORD:fitforge}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The deployed database already carries the full schema at Alembic 008, so Flyway
# stamps it as baseline V1 and runs nothing. A fresh database is built by V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- Redis -------------------------------------------------------------------
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}

# --- Runtime -----------------------------------------------------------------
# Removes the platform-thread ceiling on requests parked on IO. It is not a
# timeout, a connection limit, or failure isolation — see docs/java-migration-plan.md.
spring.threads.virtual.enabled=true

# HikariCP sizing. The default is 10, and virtual threads make that actively dangerous:
# thousands of requests can be in flight at once, all of them queueing on a pool built for
# ten. Measured at 5,000 req/s offered load with the default: 3,285 threads pending, 3,775
# acquisition timeouts, 30.9s worst-case acquire, and reads that do ~1ms of work reporting
# 860ms because nearly all of it was waiting for a connection.
#
# 24 is not "bigger is better". Postgres is configured for max_connections=100 and is shared
# with the other services on the host, so the ceiling is
# real. Connections are also not free on the server side. 24 leaves headroom for the other
# services while giving roughly two per core on a 10-core host, which is the range where
# throughput stops improving for a workload this query-light.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:24}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}

# Fail fast rather than queue. The default 30s means a saturated pool makes clients wait half
# a minute for a connection and then get an error anyway — the worst of both. 3s surfaces
# overload while the caller still cares, and sheds load instead of accumulating it.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=2000
# Recycle below typical infrastructure idle timeouts so a stale connection is never handed out.
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=fitness-pool

server.port=8000

# --- Auth / JWT --------------------------------------------------------------
# The same environment variables the previous implementation reads, so one .env configures
# both services while they run side by side.
app.jwt.secret=${SECRET_KEY}
app.jwt.access-token-expire-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:15}
app.jwt.refresh-token-expire-days=${REFRESH_TOKEN_EXPIRE_DAYS:7}
app.auth.email-verification-expire-hours=${EMAIL_VERIFICATION_EXPIRE_HOURS:24}
app.auth.password-reset-expire-hours=${PASSWORD_RESET_EXPIRE_HOURS:1}
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- AI provider -------------------------------------------------------------
# Same variables the previous implementation reads. An absent key means the feature is
# unconfigured (503), not broken.
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
# Explicit, always: the vendor SDK default is 600s, so one hung request would tie up a
# worker for ten minutes.
app.ai.timeout=${OPENAI_TIMEOUT_SECONDS:20s}
# A hard ceiling on in-flight AI calls. Virtual threads make it cheaper to pile requests
# onto a degraded provider, not safer, so the bound is explicit rather than emergent.
app.ai.max-concurrent-requests=${AI_MAX_CONCURRENT_REQUESTS:8}

# --- Transactional email -----------------------------------------------------
app.email.backend=${EMAIL_BACKEND:smtp}
app.email.from=${SMTP_FROM:Fitness Tracker <noreply@fitness-tracker.local>}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_USE_TLS:false}
# Never let a hung mail server hold a worker thread indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# --- Observability -----------------------------------------------------------
# Actuator listens on its own port, which Compose does NOT publish to the host: it is
# reachable from inside the Docker network (where Prometheus scrapes it) and nowhere
# else. /api/v1/health and /api/v1/ready stay on the application port because nginx,
# the Docker healthcheck and the frontend all use them.
management.server.port=${MANAGEMENT_PORT:9000}
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Percentile HISTOGRAMS, not client-side percentiles. Micrometer's `percentiles=` property
# pre-computes quantiles inside one JVM, which cannot be aggregated across instances and
# cannot be re-sliced after the fact. Exporting buckets lets Prometheus compute p95/p99 with
# histogram_quantile() over any window and any grouping, which is what the load tests need.
#
# Buckets are bounded deliberately: each boundary is a new time series per uri/method/status,
# so an unbounded range is how a metrics backend falls over. These eight cover the range this
# API actually operates in.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
management.metrics.distribution.percentiles-histogram.ai.request.duration=true
management.metrics.distribution.slo.ai.request.duration=250ms,500ms,1s,2s,5s,10s,30s

logging.pattern.level=%5p [${spring.application.name},%X{correlation_id:-}]
